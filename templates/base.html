<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizPulse | Interactive Quiz Application{% endblock %}</title>
    
    <!-- Google Fonts: Plus Jakarta Sans for body and Space Grotesk for headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Lucide Icons library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Background Blur Decorative Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <header class="app-header">
        <div class="container header-container">
            <a href="{{ url_for('index') }}" class="logo">
                <i data-lucide="zap" class="logo-icon"></i>
                <span class="logo-text">Quiz<span class="highlight">Pulse</span></span>
            </a>
            
            <nav class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' or request.path == '/quiz' %}active{% endif %}">
                    <i data-lucide="home"></i> Play Quiz
                </a>
                <a href="{{ url_for('leaderboard') }}" class="nav-link {% if request.path == '/leaderboard' %}active{% endif %}">
                    <i data-lucide="trophy"></i> Leaderboard
                </a>
                <a href="{{ url_for('admin') }}" class="nav-link {% if request.path == '/admin' %}active{% endif %}">
                    <i data-lucide="sliders"></i> Admin
                </a>
            </nav>
            
            <button id="theme-toggle" class="btn-theme-toggle" title="Toggle color theme">
                <i data-lucide="sun" class="sun-icon"></i>
                <i data-lucide="moon" class="moon-icon"></i>
            </button>
        </div>
    </header>

    <main class="app-main">
        <div class="container main-container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="container footer-container">
            <p>&copy; 2026 QuizPulse. Built with Python, Flask & Vanilla CSS.</p>
            <div class="footer-meta">
                <span>Designed for <strong style="color: var(--accent-light);">Avinash Kumar Sah</strong></span>
            </div>
        </div>
    </footer>

    <!-- Theme Toggle Logic & Lucide Initializer -->
    <script>
        // Init Lucide Icons
        lucide.createIcons();
        
        // Theme Toggle Script
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-theme', savedTheme);
        
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
